<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grader Audit KT video</title>
<!--
  Deterministic 1920x1080 composition. render.mjs inlines data, fonts and images in place of the
  two placeholders below and writes out/composition.html. Every frame is a pure function of time:
  window.renderAt(seconds). No CSS transitions, no animations, no randomness, no network.
-->
<style>
/*__FONTS__*/
:root {
  --bg: #0B1020; --panel: #111933; --panel2: #16203F; --line: #24304F;
  --ink: #F8FAFC; --muted: #94A3B8; --cyan: #38BDF8; --green: #34D399; --amber: #FBBF24; --red: #F87171;
  --sans: "Inter", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; transition: none !important; animation: none !important;
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; } /* show real text verbatim (no != → ≠) */
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
.scene { position: absolute; inset: 0; opacity: 0; }
.abs { position: absolute; }
.chapter { position: absolute; left: 120px; top: 56px; font-size: 22px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; }
.chapter b { color: var(--cyan); font-weight: 600; margin-right: 14px; }
.foot { position: absolute; right: 120px; bottom: 40px; font-size: 18px; color: var(--muted); letter-spacing: .04em; }
.card { position: absolute; background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; padding: 28px 34px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.lbl { font-size: 22px; color: var(--muted); letter-spacing: .03em; }
.big { font-family: var(--mono); font-size: 120px; font-weight: 500; line-height: 1; }
.badge { display: inline-block; font-size: 22px; font-weight: 700; padding: 6px 16px; border-radius: 999px; letter-spacing: .03em; }
.b-red { background: rgba(248,113,113,.16); color: var(--red); border: 1.5px solid rgba(248,113,113,.6); }
.b-green { background: rgba(52,211,153,.14); color: var(--green); border: 1.5px solid rgba(52,211,153,.55); }
.b-amber { background: rgba(251,191,36,.14); color: var(--amber); border: 1.5px solid rgba(251,191,36,.6); }
.b-cyan { background: rgba(56,189,248,.12); color: var(--cyan); border: 1.5px solid rgba(56,189,248,.55); }
.edge-red { border-color: var(--red) !important; box-shadow: 0 0 0 1px var(--red) inset; }
.edge-amber { border-color: var(--amber) !important; }
.edge-cyan { border-color: var(--cyan) !important; }
.edge-green { border-color: var(--green) !important; }
.shot { position: absolute; overflow: hidden; border-radius: 16px; border: 1.5px solid var(--line); background: #0E1424;
  box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.shot img { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: auto; }
.shot .hl { position: absolute; border-radius: 10px; border: 4px solid var(--cyan); }
.shot .tag { position: absolute; left: 18px; top: 16px; }
.note { position: absolute; font-size: 22px; color: var(--muted); }
.callout { position: absolute; font-size: 24px; line-height: 1.45; }
.callout code, .q { font-family: var(--mono); font-size: 22px; color: var(--ink); background: var(--panel2);
  padding: 3px 10px; border-radius: 8px; }
.arrow { position: absolute; height: 3px; background: var(--cyan); }
.arrow::after { content: ""; position: absolute; right: -2px; top: -7px; border-left: 14px solid var(--cyan);
  border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
.dot { display: inline-block; width: 26px; height: 26px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
.d-pass { background: var(--green); } .d-fail { background: transparent; border: 3px solid var(--red); }
.grid-cell { position: absolute; border-radius: 8px; font-family: var(--mono); font-size: 17px; display: flex;
  align-items: center; justify-content: center; }
.code { position: absolute; background: #0D1428; border: 1.5px solid var(--line); border-radius: 16px; padding: 26px 0; }
.code .ln { position: relative; display: block; font-family: var(--mono); font-size: 21px; line-height: 40px;
  white-space: pre; padding: 0 30px 0 92px; color: #CBD5E1; }
.code .ln i { position: absolute; left: 24px; width: 50px; text-align: right; font-style: normal; color: #475569; }
.code .ln .hlbar { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(56,189,248,.14);
  border-left: 5px solid var(--cyan); opacity: 0; }
.code .ln span.t { position: relative; }
.node { position: absolute; width: 300px; height: 118px; background: var(--panel); border: 2px solid var(--line);
  border-radius: 16px; padding: 18px 20px; }
.node .fn { font-family: var(--mono); font-size: 21px; color: var(--ink); white-space: nowrap; }
.node .sub { font-size: 18px; color: var(--muted); margin-top: 8px; line-height: 1.3; }
.node .num { position: absolute; right: 14px; top: 12px; font-size: 16px; color: #475569; font-family: var(--mono); }
.col h3 { font-size: 26px; margin-bottom: 18px; letter-spacing: .02em; }
.col li { font-size: 24px; line-height: 1.4; margin: 0 0 14px 28px; color: #E2E8F0; }
#controls { display: none; }
body.preview #controls { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: 56px; z-index: 99;
  background: rgba(0,0,0,.85); align-items: center; gap: 14px; padding: 0 16px; font: 16px var(--sans); color: #fff; }
#controls input[type=range] { flex: 1; }
#controls button { font: 16px var(--sans); padding: 6px 14px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="controls"><button id="play">Play</button><input id="scrub" type="range" min="0" step="0.01" value="0"><span id="clock">0:00.00</span></div>
<script>
/*__DATA__*/
</script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Data injected by render.mjs: TIMING (timing.json), RESULTS (subset of snapshot/results.json),
// TASKS (instructions), MANIFEST (capture rects), CODE (verbatim source excerpt), ASSETS (images),
// EVIDENCE (values recorded in evidence.md that are not in results.json).
// ---------------------------------------------------------------------------------------------
const T = window.TIMING, R = window.RESULTS, M = window.MANIFEST, A = window.ASSETS, EV = window.EVIDENCE;
const W = 1920, H = 1080;

// ---- math helpers -------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ramp = (t, t0, d = 0.5) => ease(clamp((t - t0) / d));
const lerp = (a, b, k) => a + (b - a) * k;
const caseOf = (task, probe) => R.cases.find((c) => c.task_id === task && c.probe === probe);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- word-timestamp beats -----------------------------------------------------------------------
// at(sceneNo, phrase) returns the global time (s) at which Kokoro started speaking `phrase` in that
// scene, from timing.json word timestamps. A missing phrase throws, so a script edit can't silently
// desynchronize a beat.
const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "");
const wordIndex = {};
function at(n, phrase) {
  const sc = T.scenes[n - 1];
  if (!wordIndex[n]) {
    let s = "", map = [];
    sc.words.forEach((w, i) => { const k = norm(w[0]); s += k; for (let j = 0; j < k.length; j++) map.push(i); });
    wordIndex[n] = { s, map };
  }
  const { s, map } = wordIndex[n];
  const pos = s.indexOf(norm(phrase));
  if (pos < 0) throw new Error(`beat phrase not found in scene ${n}: "${phrase}"`);
  return sc.words[map[pos]][1];
}

// ---- DOM helpers --------------------------------------------------------------------------------
const stage = document.getElementById("stage");
function el(parent, cls, html = "", style = {}) {
  const e = document.createElement("div");
  if (cls) e.className = cls;
  e.innerHTML = html;
  Object.assign(e.style, style);
  parent.appendChild(e);
  return e;
}
const px = (v) => `${v}px`;
function show(e, k, dy = 18) {
  e.style.opacity = k.toFixed(4);
  e.style.transform = `translateY(${((1 - k) * dy).toFixed(2)}px)`;
}

// ---- screenshot frames with deterministic zoom and highlights ------------------------------------
class Shot {
  constructor(parent, name, x, y, w, h) {
    const cap = M.captures[name];
    if (!cap) throw new Error(`no capture ${name}`);
    this.cap = cap; this.w = w; this.h = h;
    this.root = el(parent, "shot", "", { left: px(x), top: px(y), width: px(w), height: px(h) });
    this.img = document.createElement("img");
    this.img.src = A[cap.file];
    this.img.style.width = px(cap.w);
    this.img.style.height = px(cap.h);
    this.root.appendChild(this.img);
    this.hls = [];
  }
  rect(name) {
    const r = this.cap.rects[name];
    if (!r) throw new Error(`no rect ${name} in ${this.cap.file}`);
    return r;
  }
  // focus: rect (css px of the capture) or null; k: 0 = whole capture, 1 = fully focused.
  view(focus, k, pad = 24, maxScale = 2.4) {
    const cw = this.cap.w, ch = this.cap.h;
    const s0 = Math.min(this.w / cw, this.h / ch);
    let s = s0, cx = cw / 2, cy = ch / 2;
    if (focus && k > 0) {
      const sf = Math.min(this.w / (focus.w + 2 * pad), this.h / (focus.h + 2 * pad), maxScale);
      s = lerp(s0, Math.max(s0, sf), k);
      cx = lerp(cw / 2, focus.x + focus.w / 2, k);
      cy = lerp(ch / 2, focus.y + focus.h / 2, k);
    }
    // Keep the capture covering the frame where possible.
    const vw = this.w / s, vh = this.h / s;
    if (vw < cw) cx = clamp(cx, vw / 2, cw - vw / 2); else cx = cw / 2;
    if (vh < ch) cy = clamp(cy, vh / 2, ch - vh / 2); else cy = ch / 2;
    this.s = s; this.tx = this.w / 2 - cx * s; this.ty = this.h / 2 - cy * s;
    this.img.style.transform = `translate(${this.tx.toFixed(2)}px, ${this.ty.toFixed(2)}px) scale(${s.toFixed(5)})`;
    return this;
  }
  // Draw highlight i around a capture rect with a given color and opacity.
  hl(i, r, color, alpha, pad = 6) {
    while (this.hls.length <= i) this.hls.push(el(this.root, "hl"));
    const h = this.hls[i];
    // Clamp to the frame so a highlight is never clipped by the frame edge.
    const x0 = Math.max(3, r.x * this.s + this.tx - pad), y0 = Math.max(3, r.y * this.s + this.ty - pad);
    const x1 = Math.min(this.w - 3, (r.x + r.w) * this.s + this.tx + pad), y1 = Math.min(this.h - 3, (r.y + r.h) * this.s + this.ty + pad);
    h.style.left = px(x0); h.style.top = px(y0); h.style.width = px(x1 - x0); h.style.height = px(y1 - y0);
    h.style.borderColor = color;
    h.style.opacity = alpha.toFixed(4);
    return this;
  }
  hide(fromIndex = 0) { for (let i = fromIndex; i < this.hls.length; i++) this.hls[i].style.opacity = "0"; return this; }
  opacity(k) { this.root.style.opacity = k.toFixed(4); return this; }
}
const union = (...rs) => {
  const x = Math.min(...rs.map((r) => r.x)), y = Math.min(...rs.map((r) => r.y));
  const x2 = Math.max(...rs.map((r) => r.x + r.w)), y2 = Math.max(...rs.map((r) => r.y + r.h));
  return { x, y, w: x2 - x, h: y2 - y };
};

const COLORS = { cyan: "#38BDF8", green: "#34D399", amber: "#FBBF24", red: "#F87171" };
const SHORT = ["Can we trust the grader?", "What Grader Audit tests", "The synthetic test bench", "Run the audit",
  "A false positive", "A false negative", "Flakiness", "How the report is produced", "Why the hardened checks differ",
  "Evidence and limits"];

// ---- scene construction -------------------------------------------------------------------------
const scenes = [];
function scene(n, build) {
  const root = el(stage, "scene");
  el(root, "chapter", `<b>${String(n).padStart(2, "0")}</b>${esc(SHORT[n - 1])}`);
  el(root, "foot", "Synthetic tasks · scripted probes · mock judge");
  const render = build(root, T.scenes[n - 1]);
  scenes.push({ n, root, render, sc: T.scenes[n - 1] });
}

// 1 · Can we trust the grader? ----------------------------------------------------------------------
scene(1, (root, sc) => {
  const c = caseOf("A1_null_customer_ids", "substring_trap");
  const v = c.verdicts.naive;
  const q = el(root, "card", `<div class="lbl">Synthetic task · A1_null_customer_ids</div>
    <div style="font-size:38px;margin-top:14px;line-height:1.35">${esc(window.TASKS.A1_null_customer_ids)}</div>`,
    { left: "160px", top: "150px", width: "1600px" });
  const gold = el(root, "card", `<div class="lbl">Correct (gold) answer</div><div class="big" style="margin-top:16px">7</div>`,
    { left: "160px", top: "400px", width: "520px", height: "230px" });
  const probe = el(root, "card", `<div class="lbl">Scripted probe output</div>
    <div class="big" style="margin-top:16px">1<span style="border-bottom:8px solid var(--amber)">7</span></div>`,
    { left: "720px", top: "400px", width: "520px", height: "230px" });
  const verdict = el(root, "card edge-red", `<div class="lbl">naive grader</div>
    <div style="margin-top:16px"><span class="badge b-red">PASSED</span></div>
    <div class="mono" style="font-size:22px;margin-top:20px;color:#E2E8F0">${esc(v.reason)}</div>`,
    { left: "1280px", top: "400px", width: "480px", height: "230px" });
  const tag = el(root, "callout", `Label: <span class="badge b-amber">should fail</span> &nbsp;→&nbsp;
    verdict disagrees: <span class="badge b-red">false positive</span>`, { left: "160px", top: "680px" });
  const line = el(root, "callout", `<span style="font-size:40px;font-weight:600">A wrong verdict becomes a wrong score.</span>`,
    { left: "160px", top: "800px" });
  const B = { gold: at(1, "The correct answer"), probe: at(1, "probe answers"), verdict: at(1, "marks it correct"),
    tag: at(1, "because the digit"), line: at(1, "inherits the error") };
  return (t) => {
    show(q, ramp(t, 0.1));
    show(gold, ramp(t, B.gold)); show(probe, ramp(t, B.probe)); show(verdict, ramp(t, B.verdict));
    show(tag, ramp(t, B.tag)); show(line, ramp(t, B.line));
  };
});

// 2 · What Grader Audit tests -----------------------------------------------------------------------
scene(2, (root, sc) => {
  const s = R.summary.naive;
  const probeBox = el(root, "card edge-cyan", `<div class="lbl">Scripted probe</div>
    <div style="font-size:28px;margin-top:10px">fixed output + label <span class="q">should_pass</span></div>`,
    { left: "160px", top: "170px", width: "560px" });
  const a1 = el(root, "arrow", "", { left: "740px", top: "232px", width: "130px" });
  const grader = el(root, "card", `<div class="lbl">Grader under test</div><div style="font-size:28px;margin-top:10px">score 0 or 1 + reason</div>`,
    { left: "890px", top: "170px", width: "440px" });
  const a2 = el(root, "arrow", "", { left: "1350px", top: "232px", width: "110px" });
  const cmp = el(root, "card", `<div class="lbl">Compare</div><div style="font-size:28px;margin-top:10px">verdict vs label</div>`,
    { left: "1480px", top: "170px", width: "280px" });
  const mk = (x, cls, title, body, den) => el(root, `card ${cls}`, `<div style="font-size:34px;font-weight:700">${title}</div>
    <div style="font-size:26px;margin-top:16px;line-height:1.4">${body}</div>
    <div class="lbl" style="margin-top:22px">${den}</div>`, { left: px(x), top: "420px", width: "500px", height: "330px" });
  const fp = mk(160, "edge-red", '<span style="color:var(--red)">False positive</span>',
    "passed, but the label says <b>should fail</b>", `rate over the ${s.negatives} should-fail cases`);
  const fn = mk(710, "edge-red", '<span style="color:var(--red)">False negative</span>',
    "failed, but the label says <b>should pass</b>", `rate over the ${s.positives} should-pass cases`);
  const fl = mk(1260, "edge-amber", '<span style="color:var(--amber)">Flaky</span>',
    "the verdict changes across repeated runs of the same input", `rate over all ${s.total} cases`);
  const disc = el(root, "callout", `<span class="muted">Independent prototype · synthetic tasks · scripted probes · does not audit HUD's actual benchmarks</span>`,
    { left: "160px", top: "830px", width: "1600px" });
  const B = { probes: at(2, "scripted probes"), wrong: at(2, "three ways"), fp: at(2, "A false positive"),
    fn: at(2, "A false negative"), fl: at(2, "A flaky verdict"), disc: at(2, "This is an independent") };
  return (t) => {
    show(probeBox, ramp(t, B.probes)); show(a1, ramp(t, B.probes + 0.4), 0); show(grader, ramp(t, B.probes + 0.6));
    show(a2, ramp(t, B.wrong - 0.4), 0); show(cmp, ramp(t, B.wrong - 0.2));
    show(fp, ramp(t, B.fp)); show(fn, ramp(t, B.fn)); show(fl, ramp(t, B.fl)); show(disc, ramp(t, B.disc));
  };
});

// 3 · The synthetic test bench ----------------------------------------------------------------------
scene(3, (root, sc) => {
  const probes = R.meta.probes;
  const tasks = [...new Set(R.cases.map((c) => c.task_id))];
  const order = (id) => ({ A: 0, T: 1, S: 2 }[id[0]]) * 100 + Number(id[1]);
  tasks.sort((a, b) => order(a) - order(b));
  const x0 = 520, colW = 152, y0 = 205, rowH = 50;
  const yOf = (i) => y0 + 46 + i * rowH + (i >= 4 ? 14 : 0) + (i >= 9 ? 14 : 0);
  const heads = probes.map((p, j) => el(root, "abs mono", esc(p), { left: px(x0 + j * colW), top: px(y0), width: px(colW - 8),
    textAlign: "center", fontSize: "17px", color: "#CBD5E1" }));
  const rows = tasks.map((id, i) => el(root, "abs mono", esc(id), { left: "160px", top: px(yOf(i) + 10), fontSize: "19px", color: "#E2E8F0" }));
  const cells = [];
  let special = null;
  tasks.forEach((id, i) => probes.forEach((p, j) => {
    const c = caseOf(id, p);
    const e = el(root, "grid-cell", c.should_pass ? "pass" : "fail", {
      left: px(x0 + j * colW), top: px(yOf(i)), width: px(colW - 8), height: px(rowH - 8),
      border: c.should_pass ? "2px solid rgba(56,189,248,.7)" : "2px solid #24304F",
      background: c.should_pass ? "rgba(56,189,248,.10)" : "#16203F", color: c.should_pass ? "#7DD3FC" : "#64748B" });
    cells.push({ e, i, j });
    if (id === "T5_top_customers" && p === "shuffled") special = e;
  }));
  const ring = el(root, "abs", "", { left: px(parseFloat(special.style.left) - 6), top: px(parseFloat(special.style.top) - 6),
    width: px(colW + 4), height: px(rowH + 4), border: "4px solid var(--amber)", borderRadius: "12px" });
  const callout = el(root, "callout", `<span style="color:var(--amber)">T5 × shuffled:</span> row order is part of the answer → <b>should fail</b>`,
    { left: "160px", top: "905px" });
  const pos = R.summary.naive.positives, neg = R.summary.naive.negatives;
  const totals = el(root, "callout", `<b>${tasks.length} tasks × ${probes.length} probes = ${R.meta.n_cases} cases</b>
    &nbsp;·&nbsp; <span style="color:#7DD3FC">${pos} should pass</span> &nbsp;·&nbsp; <span class="muted">${neg} should fail</span>`,
    { left: "160px", top: "965px", fontSize: "30px" });
  const B = { rows: at(3, "twelve synthetic"), probes: at(3, "eight probes"), labels: at(3, "Labels depend"),
    t5: at(3, "except in a top five"), totals: at(3, "ninety-six cases") };
  return (t) => {
    rows.forEach((r, i) => show(r, ramp(t, B.rows + i * 0.08, 0.35), 8));
    heads.forEach((h, j) => show(h, ramp(t, B.probes + j * 0.12, 0.35), 8));
    cells.forEach(({ e, i, j }) => { e.style.opacity = ramp(t, B.labels + (i + j) * 0.04, 0.35).toFixed(4); });
    show(ring, ramp(t, B.t5), 0); show(callout, ramp(t, B.t5 + 0.2)); show(totals, ramp(t, B.totals));
  };
});

// 4 · Run the audit -------------------------------------------------------------------------------
scene(4, (root, sc) => {
  const s = R.summary;
  const line = (name) => `  ${name.padEnd(9)} FP ${s[name].fp}/${s[name].negatives}  FN ${s[name].fn}/${s[name].positives}  flaky ${s[name].flaky}/${s[name].total}`;
  const term = el(root, "card", `<div class="lbl" style="margin-bottom:16px">Terminal · recorded run (JUDGE_MODEL unset → mock judge, k = 5)</div>
    <pre class="mono" style="font-size:28px;line-height:1.6;color:#E2E8F0"><span style="color:var(--cyan)">$</span> python -m audit.serve
${esc(line("naive"))}
${esc(line("hardened"))}
  Grader Audit UI: http://localhost:8000</pre>`, { left: "260px", top: "300px", width: "1400px" });
  const shot = new Shot(root, "summary", 120, 170, 1680, 1680 * M.captures.summary.h / M.captures.summary.w);
  const maj = el(root, "callout", `<span class="dot d-fail"></span><span class="dot d-pass"></span><span class="dot d-fail"></span><span class="dot d-pass"></span><span class="dot d-pass"></span>
    <span style="font-size:30px;margin:0 16px;color:var(--cyan)">→</span><span class="dot d-pass" style="width:34px;height:34px"></span>
    <div style="margin-top:14px">Five runs per case → one <b>majority verdict</b>.<br>FP and FN counts use that verdict.</div>`,
    { left: "160px", top: "560px", width: "760px" });
  const fr = shot.view(null, 0).rect("naive_flaky");
  const round = el(root, "note", `<span style="color:var(--amber)">6/96 cases;</span> percentage rounding differs between views.`,

    "real browser or desktop environments", "a real model judge"]);
  const c3 = col(1260, 540, "var(--cyan)", "Future work", ["model-generated adversarial probes, reviewed by a person", "adapters for graders over real environments"]);
  const end = el(root, "callout", `<span class="muted">Independent prototype · synthetic data · not affiliated with HUD</span>`,
    { left: "120px", top: "880px", fontSize: "26px" });
  const B = { tests: at(10, "One hundred fifty-two"), mut: at(10, "A mutation test"), swap: at(10, "swaps an equality"),
    fp: at(10, "reports a false positive"), c1: at(10, "So the harness"), c2: at(10, "doesnt show"), c3: at(10, "Future work"), end: at(10, "adapters") };
  return (t) => {
    show(tests, ramp(t, B.tests)); show(mut, ramp(t, B.mut));
    strike.style.opacity = ramp(t, B.swap + 0.6).toFixed(4); inop.style.opacity = ramp(t, B.swap + 0.9).toFixed(4);
    fpb.style.opacity = ramp(t, B.fp).toFixed(4);
    show(c1, ramp(t, B.c1)); show(c2, ramp(t, B.c2)); show(c3, ramp(t, B.c3)); show(end, ramp(t, B.end));
  };
});

// ---- the deterministic frame function --------------------------------------------------------------
// Transition: the outgoing scene fades out over the last 0.3 s of its trailing silence and the
// incoming scene fades in from 0.1 s before its first word, so the stage passes briefly through the
// background instead of stacking two dense layouts on top of each other.
const OUT_D = 0.3, OUT_END = 0.0, IN_D = 0.25, IN_LEAD = 0.1;
window.renderAt = function renderAt(t) {
  const last = scenes.length - 1;
  scenes.forEach((s, i) => {
    const a = s.sc.start, b = s.sc.end;
    const kin = i === 0 ? 1 : ramp(t, a - IN_LEAD, IN_D);
    const kout = i === last ? 1 : 1 - ramp(t, b - OUT_END - OUT_D, OUT_D);
    const k = Math.min(kin, kout);
    s.root.style.opacity = k.toFixed(4);
    s.root.style.visibility = k > 0 ? "visible" : "hidden";
    if (k > 0) s.render(t);
  });
  // Total scene opacity: ~1 everywhere if crossfades never dip to an empty frame (used by QA).
  return scenes.reduce((a, s) => a + parseFloat(s.root.style.opacity), 0);
};
window.DURATION = T.total;

// Every image decoded and every font loaded before the first frame is captured.
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode())]).then(() => {
  window.renderAt(0);
  return true;
});

// ---- preview controls (not used by the renderer) ------------------------------------------------
if (location.hash.includes("preview")) {
  document.body.classList.add("preview");
  const scrub = document.getElementById("scrub"), clock = document.getElementById("clock"), play = document.getElementById("play");
  scrub.max = T.total;
  const audio = new Audio("../audio/narration.wav");
  const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, "0")}`;
  const tick = () => { const t = audio.currentTime; window.renderAt(t); scrub.value = t; clock.textContent = fmt(t); if (!audio.paused) requestAnimationFrame(tick); };
  play.onclick = () => { if (audio.paused) { audio.play(); play.textContent = "Pause"; requestAnimationFrame(tick); } else { audio.pause(); play.textContent = "Play"; } };
  scrub.oninput = () => { audio.currentTime = +scrub.value; window.renderAt(+scrub.value); clock.textContent = fmt(+scrub.value); };
}
</script>
</body>
