<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grader Audit: KT walkthrough</title>
<!--
  Deterministic 1920x1080 composition. render.mjs replaces the two placeholders below (fonts, data)
  and writes out/composition.html. Every frame is a pure function of time: window.renderAt(seconds).
  No CSS transitions or animations, no requestAnimationFrame timing, no randomness, no network.
  Open out/composition.html#preview for a play/scrub preview synced to the narration.
-->
<style>
/*__FONTS__*/
:root {
  /* stage */
  --bg: #0A0E1A; --panel: #121829; --panel2: #182037; --line: #263049; --ink: #EEF2F8; --muted: #8B97AF; --dim: #4B5672;
  /* accents: one meaning each, used the same way in every scene */
  --data: #5AB0FF;    /* data / probe output in motion */
  --state: #F2B544;   /* stored state on disk */
  --grader: #A78BFA;  /* a grader or judge */
  --ok: #4ADE80;      /* verdict agrees with the label */
  --bad: #F87171;     /* wrong verdict (FP / FN) or unstable (flaky) */
  --display: "Space Grotesk", "Segoe UI", sans-serif;
  --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; transition: none !important; animation: none !important;
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; } /* show code verbatim: != stays != */
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.scene { position: absolute; inset: 0; opacity: 0; }
.abs { position: absolute; }
.chapter { position: absolute; left: 120px; top: 52px; font: 600 20px var(--sans); letter-spacing: .16em;
  text-transform: uppercase; color: var(--muted); }
.chapter b { color: var(--ink); font-weight: 700; margin-right: 10px; }
.title { position: absolute; left: 120px; top: 92px; font: 700 54px/1.1 var(--display); letter-spacing: -.01em; }
.foot { position: absolute; right: 120px; bottom: 26px; font-size: 16px; color: var(--dim); letter-spacing: .03em; }
.card { position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 24px 30px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 18px; }
.lbl { font: 500 18px var(--mono); color: var(--muted); letter-spacing: .02em; }
.chip { display: inline-block; font: 600 20px var(--sans); padding: 6px 16px; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
.c-data { color: var(--data); border: 2px solid var(--data); background: rgba(90,176,255,.10); }
.c-state { color: var(--state); border: 2px solid var(--state); background: rgba(242,181,68,.10); }
.c-grader { color: var(--grader); border: 2px solid var(--grader); background: rgba(167,139,250,.10); }
.c-ok { color: var(--ok); border: 2px solid var(--ok); background: rgba(74,222,128,.10); }
.c-bad { color: var(--bad); border: 2px solid var(--bad); background: rgba(248,113,113,.10); }
.c-flaky { color: var(--bad); border: 2px dashed var(--bad); background: transparent; }
.b-data { border-color: var(--data) !important; } .b-state { border-color: var(--state) !important; }
.b-grader { border-color: var(--grader) !important; } .b-ok { border-color: var(--ok) !important; }
.b-bad { border-color: var(--bad) !important; }
.t-data { color: var(--data); } .t-state { color: var(--state); } .t-grader { color: var(--grader); }
.t-ok { color: var(--ok); } .t-bad { color: var(--bad); }
code, .code-inline { font-family: var(--mono); }
/* code panes */
.code { position: absolute; background: #0D1324; border: 2px solid var(--line); border-radius: 16px; padding: 18px 0 20px; }
.code .path { font: 500 18px var(--mono); color: var(--muted); padding: 0 28px 12px; }
.code .path b { color: var(--grader); font-weight: 500; }
.code .ln { position: relative; display: block; font: 400 20px/36px var(--mono); white-space: pre; padding: 0 28px 0 96px; color: #C9D3E3; }
.code .ln i { position: absolute; left: 20px; width: 56px; text-align: right; font-style: normal; color: var(--dim); }
.code .ln .bar { position: absolute; inset: 0; background: rgba(167,139,250,.16); border-left: 5px solid var(--grader); opacity: 0; }
.code .ln .tx { position: relative; }
.code .ln.gap { color: var(--dim); }
.code.tight .ln { font-size: 19px; line-height: 31px; }
.code.tight .ln.gap { line-height: 18px; }
/* boxes in diagrams */
.box { position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 18px 22px; }
.box .h { font: 500 25px var(--mono); white-space: nowrap; }
.box .s { font-size: 19px; color: var(--muted); margin-top: 8px; line-height: 1.35; }
.disk { border-color: var(--state); border-radius: 16px 16px 40px 40px / 16px 16px 26px 26px; }
.disk .h { color: var(--state); }
.pill { margin-top: 12px; border: 2px solid var(--grader); border-radius: 12px; padding: 8px 14px; font: 500 20px var(--mono); color: var(--grader); }
.pill.dashed { border-style: dashed; }
.pill span { display: block; font: 400 16px var(--sans); color: var(--muted); margin-top: 2px; }
.token { position: absolute; font: 600 26px var(--mono); color: #071324; background: var(--data); border-radius: 12px;
  padding: 4px 14px; box-shadow: 0 0 0 6px rgba(90,176,255,.18); }
.dot { display: inline-block; width: 26px; height: 26px; border-radius: 50%; margin-right: 10px; vertical-align: middle; border: 3px solid; }
svg.ov { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
.grid-cell { position: absolute; border-radius: 8px; border: 2px solid; font: 400 15px var(--mono); display: flex;
  align-items: center; justify-content: center; }
#controls { display: none; }
body.preview #controls { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: 52px; z-index: 99;
  background: rgba(0,0,0,.85); align-items: center; gap: 14px; padding: 0 16px; font: 16px var(--sans); color: #fff; }
#controls input[type=range] { flex: 1; }
#controls button { font: 16px var(--sans); padding: 6px 14px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="controls"><button id="play">Play</button><input id="scrub" type="range" min="0" step="0.01" value="0"><span id="clock">0:00.00</span></div>
<script>
/*__DATA__*/
</script>
<script>
"use strict";
// Injected by render.mjs: TIMING (timing.json), FACTS (facts.json), ASSETS (UI captures as data URLs),
// MANIFEST (element rectangles inside the captures).
const T = window.TIMING, F = window.FACTS, A = window.ASSETS, M = window.MANIFEST;
const FADE = 0.3;

// ---- pure helpers ---------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2); // ease-in-out cubic
const ramp = (t, t0, d = 0.5) => ease(clamp((t - t0) / d));
const lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const px = (v) => `${v}px`;

// ---- beats from Kokoro word timestamps --------------------------------------------------------------
// at(scene, phrase, nth) = global time when the nth occurrence of `phrase` starts in that scene's audio.
// A phrase that no longer exists in the narration throws, so a script edit can't silently desync a beat.
const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "");
const idx = {};
function at(n, phrase, nth = 0) {
  const sc = T.scenes[n - 1];
  if (!idx[n]) {
    let s = ""; const map = [];
    sc.words.forEach((w, i) => { const k = norm(w[0]); s += k; for (let j = 0; j < k.length; j++) map.push(i); });
    idx[n] = { s, map };
  }
  const { s, map } = idx[n];
  let pos = -1;
  for (let i = 0; i <= nth; i++) { pos = s.indexOf(norm(phrase), pos + 1); if (pos < 0) break; }
  if (pos < 0) throw new Error(`beat phrase not found in scene ${n}: "${phrase}" (#${nth})`);
  return sc.words[map[pos]][1];
}

// ---- DOM helpers (DOM is built once; renderAt only sets styles/text) -------------------------------
const stage = document.getElementById("stage");
function el(parent, cls, html = "", style = {}) {
  const e = document.createElement("div");
  if (cls) e.className = cls;
  e.innerHTML = html;
  for (const [k, v] of Object.entries(style)) e.style[k] = typeof v === "number" ? px(v) : v;
  parent.appendChild(e);
  return e;
}
// Elements at rest get no transform and fully transparent ones are hidden, so compositor layers
// never depend on which frames were drawn before (keeps frames byte-identical for any render order).
function show(e, k, dy = 16, dx = 0) {
  e.style.opacity = k >= 1 ? "" : k.toFixed(4);
  e.style.visibility = k <= 0 ? "hidden" : "";
  e.style.transform = k >= 1 ? "" : `translate(${((1 - k) * dx).toFixed(2)}px, ${((1 - k) * dy).toFixed(2)}px)`;
}
// Type text deterministically: characters revealed = f(t).
function typeAt(e, text, t, t0, cps = 45) {
  const n = Math.floor(clamp((t - t0) * cps, 0, text.length));
  e.textContent = text.slice(0, n);
}
const SVGNS = "http://www.w3.org/2000/svg";
function svgLayer(parent) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("class", "ov"); s.setAttribute("viewBox", "0 0 1920 1080");
  parent.appendChild(s);
  return s;
}
// Arrow that draws itself from start to end as k goes 0 -> 1. pts = [[x,y], ...] polyline.
function arrow(svg, pts, color, width = 3) {
  const p = document.createElementNS(SVGNS, "path");
  p.setAttribute("d", "M" + pts.map((q) => q.join(" ")).join(" L"));
  p.setAttribute("fill", "none"); p.setAttribute("stroke", color); p.setAttribute("stroke-width", width);
  p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
  const head = document.createElementNS(SVGNS, "path");
  const [x1, y1] = pts[pts.length - 2], [x2, y2] = pts[pts.length - 1];
  const a = Math.atan2(y2 - y1, x2 - x1), L = 16, Wd = 8;
  const bx = x2 - L * Math.cos(a), by = y2 - L * Math.sin(a);
  head.setAttribute("d", `M${x2} ${y2} L${bx + Wd * Math.sin(a)} ${by - Wd * Math.cos(a)} L${bx - Wd * Math.sin(a)} ${by + Wd * Math.cos(a)} Z`);
  head.setAttribute("fill", color);
  svg.appendChild(p); svg.appendChild(head);
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  p.setAttribute("stroke-dasharray", `${len} ${len}`);
  return (k) => {
    p.setAttribute("stroke-dashoffset", ((1 - k) * len).toFixed(2));
    p.style.opacity = k > 0 ? "1" : "0";
    head.style.opacity = clamp((k - 0.85) / 0.15).toFixed(3);
  };
}
// A real source excerpt with line numbers; returns {root, rows: Map(lineNo -> row element)}.
function codePane(parent, key, x, y, w, label) {
  const ex = F.code[key];
  const root = el(parent, "code", "", { left: x, top: y, width: w });
  el(root, "path", `<b>${esc(ex.file)}</b>${label ? "  ·  " + esc(label) : ""}`);
  const rows = new Map();
  for (const [n, text] of ex.lines) {
    const gap = n === "...";
    const r = el(root, "ln" + (gap ? " gap" : ""), `<span class="bar"></span><i>${gap ? "" : n}</i><span class="tx">${esc(text)}</span>`);
    if (!gap) rows.set(n, r);
  }
  return { root, rows };
}
function hiRows(pane, lines, k) {
  for (const n of lines) pane.rows.get(n).querySelector(".bar").style.opacity = k.toFixed(3);
}
function dots(parent, runs, color, filledWhen = 1) {
  const wrap = el(parent, "", "", { display: "inline-block" });
  const ds = runs.map((r) => el(wrap, "dot", "", { borderColor: color, background: r === filledWhen ? color : "transparent" }));
  return { wrap, ds };
}

// ---- scenes ---------------------------------------------------------------------------------------
const SCENES = [];
function scene(n, build) {
  const sc = T.scenes[n - 1];
  const root = el(stage, "scene");
  const [num, name] = sc.label.split(" / ");
  el(root, "chapter", `<b>${esc(num)}</b>/ ${esc(name)}`);
  const foot = el(root, "foot", "Independent prototype · synthetic data · not affiliated with HUD");
  const update = build(root, sc, n);
  SCENES.push({ n, sc, root, update, foot });
}

// 01 · The grader can be the bug ------------------------------------------------------------------
scene(1, (root, sc, n) => {
  const a1 = F.a1;
  const title = el(root, "title", "Can you trust the grader?");
  const task = el(root, "card", `
    <div class="lbl">task · A1_null_customer_ids</div>
    <div style="font-size:31px;line-height:1.35;margin-top:14px">${esc(a1.instruction)}</div>
    <div style="margin-top:22px"><span class="chip c-state">gold.txt&nbsp;&nbsp;<span class="mono">${esc(a1.gold)}</span></span></div>`,
    { left: 120, top: 220, width: 820, height: 240 });
  const probe = el(root, "card b-data", `
    <div class="lbl">probe · substring_trap · label: <span class="t-bad">should fail</span></div>
    <div class="mono t-data" style="font-size:150px;line-height:1;margin-top:18px;font-weight:500">1<span id="s1u" style="border-bottom:8px solid transparent">${esc(a1.gold)}</span></div>`,
    { left: 120, top: 496, width: 820, height: 270 });
  const under = probe.querySelector("#s1u");
  const svg = svgLayer(root);
  const arr = arrow(svg, [[950, 631], [1030, 631]], "var(--data)");
  const naiveIf = F.code.naive_answer_if.lines[0];
  const grader = el(root, "card b-grader", `
    <div class="mono t-grader" style="font-size:30px">naive.grade_answer</div>
    <div class="lbl" style="margin-top:6px">${esc(F.code.naive_answer_if.file)}:${naiveIf[0]}</div>
    <div class="mono" style="font-size:24px;margin-top:16px;background:#0D1324;border-radius:10px;padding:12px 16px">${esc(naiveIf[1])}</div>
    <div style="margin-top:26px;display:flex;align-items:center;gap:18px">
      <span class="chip c-bad" id="s1pass" style="font-size:30px;padding:8px 26px">PASS</span>
      <span class="mono" id="s1reason" style="font-size:21px;color:var(--ink)"></span></div>
    <div id="s1fp" style="margin-top:22px;font-size:22px" class="t-bad">score 1 on a should-fail case → false positive</div>`,
    { left: 1040, top: 406, width: 760, height: 360 });
  const pass = grader.querySelector("#s1pass"), reason = grader.querySelector("#s1reason"), fp = grader.querySelector("#s1fp");
  const src = el(root, "abs", `<span class="lbl">public report</span>&nbsp;&nbsp; OSWorld issue #518: reward = 1 from loose substring matching <span class="muted small">&nbsp;(cited in PRD.md)</span>`,
    { left: 120, top: 820, fontSize: "22px" });
  const close = el(root, "abs", "A wrong grader corrupts the score.", { left: 120, top: 900, font: "700 40px var(--display)" });
  const tProbe = at(n, "answers seventeen"), tPass = at(n, "passes it"), tIn = at(n, "appears inside"),
    tSrc = at(n, "Public reports"), tClose = at(n, "measures the grader");
  return (t) => {
    show(title, ramp(t, sc.start - FADE, 0.6));
    show(task, ramp(t, sc.start + 0.2, 0.6));
    show(probe, ramp(t, tProbe - 0.2, 0.6), 0, -60);
    arr(ramp(t, tProbe + 0.4, 0.5));
    show(grader, ramp(t, tProbe + 0.6, 0.5));
    const kp = ramp(t, tPass, 0.35);
    pass.style.opacity = kp.toFixed(3); pass.style.transform = `scale(${lerp(1.25, 1, kp).toFixed(3)})`;
    typeAt(reason, a1.naive.reason, t, tPass + 0.3);
    grader.style.borderColor = t >= tPass + 0.2 ? "var(--bad)" : "var(--grader)";
    show(fp, ramp(t, tPass + 1.2, 0.5));
    under.style.borderBottomColor = `rgba(248,113,113,${ramp(t, tIn, 0.4).toFixed(3)})`;
    show(src, ramp(t, tSrc, 0.5));
    show(close, ramp(t, tClose, 0.5));
    const dim = 1 - 0.45 * ramp(t, tClose, 0.6);
    pass.parentElement.style.opacity = dim.toFixed(3);
  };
});

// 02 · Grade the grader --------------------------------------------------------------------------
scene(2, (root, sc, n) => {
  const title = el(root, "title", "Audit the grader, not the agent");
  const order = ["A1", "A2", "A3", "A4", "T1", "T2", "T3", "T4", "T5", "S1", "S2", "S3"];
  const tasks = [...new Set(F.labels.map((l) => l[0]))].sort((a, b) => order.indexOf(a.slice(0, 2)) - order.indexOf(b.slice(0, 2)));
  const probes = F.meta.probes;
  const X0 = 470, PX = 158, CW = 150, Y0 = 290, PY = 44, CH = 38;
  const typeOf = { A: "answer", T: "table", S: "state" };
  const rows = tasks.map((id, r) => el(root, "abs", `<span class="mono" style="font-size:19px">${id.slice(0, 2)}</span>
    <span class="muted mono" style="font-size:15px;margin-left:8px">${esc(id.slice(3))}</span>`,
    { left: 120, top: Y0 + r * PY + 6, width: 340, whiteSpace: "nowrap", overflow: "hidden" }));
  const types = ["A", "T", "S"].map((ch) => {
    const r0 = tasks.findIndex((id) => id[0] === ch), r1 = tasks.length - 1 - [...tasks].reverse().findIndex((id) => id[0] === ch);
    return el(root, "abs lbl", typeOf[ch], { left: X0 + 8 * PX + 8, top: Y0 + ((r0 + r1) / 2) * PY + 8, fontSize: "15px" });
  });
  const heads = probes.map((p, c) => el(root, "abs mono", esc(p), { left: X0 + c * PX, top: Y0 - 34, width: CW, textAlign: "center", fontSize: "15px", color: "var(--muted)" }));
  const label = {}; F.labels.forEach(([tid, p, sp]) => (label[tid + "|" + p] = sp));
  const cells = [];
  tasks.forEach((tid, r) => probes.forEach((p, c) => {
    const sp = label[tid + "|" + p];
    const note = tid.startsWith("T5") && p === "shuffled" ? "*" : "";
    cells.push([r, c, el(root, "grid-cell", (sp ? "pass" : "fail") + note, {
      left: X0 + c * PX, top: Y0 + r * PY, width: CW, height: CH,
      borderColor: sp ? "var(--ok)" : "var(--dim)", color: sp ? "var(--ok)" : "var(--muted)",
      background: sp ? "rgba(74,222,128,.06)" : "transparent" })]);
  }));
  const pos = F.summary.naive.positives, neg = F.summary.naive.negatives;
  const counter = el(root, "abs", `<span class="mono" style="font-size:30px">${F.meta.n_cases}</span> labeled cases &nbsp;=&nbsp;
    <span class="t-ok">${pos} should pass</span> + <span class="muted">${neg} should fail</span>`, { left: 1100, top: 112, fontSize: "24px" });
  const foot5 = el(root, "abs muted", "* T5 is a top-5 table where row order matters, so shuffled rows should fail there.",
    { left: X0, top: Y0 + 12 * PY + 2, fontSize: "17px" });
  const defs = [
    ["False positive", "score 1 on a should-fail case", `out of ${neg}`, "c-bad"],
    ["False negative", "score 0 on a should-pass case", `out of ${pos}`, "c-bad"],
    ["Flaky", "verdict differs across the 5 runs", `out of ${F.meta.n_cases}`, "c-flaky"]];
  const chips = defs.map(([h, d, o, cls], i) => el(root, "card", `<span class="chip ${cls}">${h}</span>
    <div style="font-size:22px;margin-top:12px">${d} <span class="muted">· ${o}</span></div>`,
    { left: 120 + i * 570, top: 878, width: 540, height: 128, padding: "16px 24px" }));
  const tTasks = at(n, "Twelve synthetic"), tCases = at(n, "ninety-six cases");
  const beatsP = { gold: at(n, "Gold"), paraphrase: at(n, "paraphrase"), noop: at(n, "no-op"),
    substring_trap: at(n, "substring trap"), look_done: at(n, "fake that only looks done") };
  const tMore = at(n, "and more");
  const tDef = [at(n, "A false positive"), at(n, "A false negative"), at(n, "A flaky verdict")];
  return (t) => {
    show(title, ramp(t, sc.start - FADE, 0.6));
    rows.forEach((r, i) => show(r, ramp(t, tTasks + i * 0.07, 0.4), 0, -20));
    types.forEach((r) => show(r, ramp(t, tTasks + 0.9, 0.4)));
    heads.forEach((h, c) => {
      const p = probes[c];
      const t0 = beatsP[p] !== undefined ? beatsP[p] : tMore + 0.15 * ["format_variant", "shuffled", "partial"].indexOf(p);
      show(h, ramp(t, t0, 0.35), -10);
      h.style.color = t >= t0 && t < t0 + 1.0 ? "var(--ink)" : "var(--muted)";
    });
    for (const [r, c, e] of cells) show(e, ramp(t, tCases + (r * 8 + c) * 0.014, 0.3), 6);
    show(counter, ramp(t, tCases + 0.4, 0.5));
    show(foot5, ramp(t, tCases + 1.6, 0.5));
    chips.forEach((ch, i) => show(ch, ramp(t, tDef[i], 0.45), 24));
  };
});

// 03 · Architecture -------------------------------------------------------------------------------
scene(3, (root, sc, n) => {
  const title = el(root, "title", "A straight pipeline, one fixed seed");
  const B = (x, y, w, h, html, cls = "") => el(root, "box " + cls, html, { left: x, top: y, width: w, height: h });
  const W = 360, H = 170, R1 = 250, R2 = 640;
  const tasks = B(120, R1, W, H, `<div class="h">tasks.py</div><div class="s"><code>build_tasks()</code> · 12 tasks<br>SEED = 1337</div>`);
  const probes = B(560, R1, W, H, `<div class="h">probes.py</div><div class="s"><code>build_probes()</code><br>8 outputs per task + label</div>`);
  const gen = B(1000, R1, W, H, `<div class="h">generate.py</div><div class="s">writes everything to disk<br>byte-for-byte deterministic</div>`);
  const data = B(1440, R1, W, H, `<div class="h">data/</div><div class="s">tasks/ · probes/<br>labels.json</div>`, "disk");

// ---- renderAt -------------------------------------------------------------------------------------
// Scene i fades out over [end - FADE, end] while scene i+1 fades in over [start - FADE, start]
// (the 0.6 s silent pad), so the crossfade never passes through an empty frame.
function renderAt(t) {
  t = clamp(t, 0, T.total);
  let sum = 0;
  SCENES.forEach(({ sc, root, update }, i) => {
    const first = i === 0, last = i === SCENES.length - 1;
    const kin = first ? 1 : ramp(t, sc.start - FADE, FADE);
    const kout = last ? 1 : 1 - ramp(t, sc.end - FADE, FADE);
    const k = kin * kout;
    root.style.opacity = k >= 1 ? "1" : k.toFixed(4);
    root.style.visibility = k > 0 ? "visible" : "hidden";
    if (k > 0) update(t);
    sum += k;
  });
  return sum;
}
window.renderAt = renderAt;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.decode().catch(() => {})))).then(() => { renderAt(0); return true; });

// ---- preview mode (open with #preview; not used by the renderer) ---------------------------------
if (location.hash === "#preview") {
  document.body.classList.add("preview");
  const audio = new Audio("../audio/narration.wav");
  const scrub = document.getElementById("scrub"), clock = document.getElementById("clock"), play = document.getElementById("play");
  scrub.max = T.total;
  const fmt = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}`;
  const draw = (s) => { renderAt(s); scrub.value = s; clock.textContent = fmt(s); };
  play.onclick = () => { if (audio.paused) { audio.play(); play.textContent = "Pause"; } else { audio.pause(); play.textContent = "Play"; } };
  scrub.oninput = () => { audio.currentTime = +scrub.value; draw(+scrub.value); };
  const loop = () => { if (!audio.paused) draw(audio.currentTime); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
